name: geo_aether
description: "A Flutter project for geospatial pinning with authentication and JSON locations."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Map & Geospatial Dependencies
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  file_picker: ^8.1.3
  sqflite: ^2.4.0
  path_provider: ^2.1.4
  
  # Network & Backend
  http: ^1.2.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/locations.json